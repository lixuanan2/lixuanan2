<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jiarong Li — AI-assisted builder and full-stack explorer</title>
  <desc id="desc">A dark blue profile banner with a soft grid, glowing accent shapes, and a path from Lisbon to Beijing.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1140" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/>
      <stop offset="0.5" stop-color="#101B34"/>
      <stop offset="1" stop-color="#111A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="214" y1="75" x2="934" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF"/>
      <stop offset="0.5" stop-color="#80B8FF"/>
      <stop offset="1" stop-color="#E8A76A"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(188 74) rotate(36) scale(286 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#376EE6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#376EE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientTransform="translate(1048 296) rotate(-142) scale(280 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A76A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8A76A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#AFC7FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#blueGlow)"/>
    <rect width="1200" height="360" fill="url(#warmGlow)"/>

    <path d="M-50 313C190 208 310 377 526 266C730 160 849 258 1250 78" stroke="url(#accent)" stroke-opacity="0.17" stroke-width="2"/>
    <path d="M-31 329C201 233 337 392 542 284C731 184 876 272 1237 116" stroke="#AFC7FF" stroke-opacity="0.07"/>

    <g opacity="0.86">
      <circle cx="1014" cy="91" r="49" stroke="#80B8FF" stroke-opacity="0.24"/>
      <circle cx="1014" cy="91" r="31" stroke="#80B8FF" stroke-opacity="0.16"/>
      <circle cx="1014" cy="91" r="5" fill="#80B8FF"/>
      <path d="M941 91H1087M1014 18V164" stroke="#80B8FF" stroke-opacity="0.1"/>
    </g>

    <g opacity="0.78">
      <rect x="962" y="232" width="151" height="55" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <circle cx="987" cy="259.5" r="6" fill="#E8A76A"/>
      <path d="M1006 251H1085M1006 267H1062" stroke="#C6D4ED" stroke-opacity="0.48" stroke-width="3" stroke-linecap="round"/>
    </g>

    <rect x="74" y="63" width="74" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="74" y="121" fill="#F4F7FC" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="1">JIARONG LI</text>
    <text x="76" y="168" fill="#AFC1DF" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" letter-spacing="4">AI-ASSISTED BUILDER · FULL-STACK EXPLORER</text>

    <g transform="translate(76 218)">
      <rect width="384" height="58" rx="15" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <circle cx="28" cy="29" r="7" fill="#5B8CFF"/>
      <path d="M35 29H137" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="144" cy="29" r="7" fill="#E8A76A"/>
      <text x="168" y="36" fill="#D9E3F5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500">Lisbon  →  Beijing</text>
    </g>

    <text x="77" y="319" fill="#8292AD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="1.4">BUILD · VERIFY · ITERATE</text>

    <circle cx="144" cy="29" r="24" fill="#5B8CFF" fill-opacity="0.3" filter="url(#softGlow)"/>
    <circle cx="1088" cy="316" r="28" fill="#E8A76A" fill-opacity="0.22" filter="url(#softGlow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="27.5" stroke="#AFC7FF" stroke-opacity="0.14"/>
</svg>
